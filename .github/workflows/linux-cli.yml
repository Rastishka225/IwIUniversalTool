name: Linux CLI

on:
  push:
    branches: [ main, dev ]
    paths:
      - 'IwIUniversalTool.Cli/**'
      - 'IwIUniversalTool/IwiCodec.cs'
      - 'IwIUniversalTool/VtfCodec.cs'
      - 'IwIUniversalTool/WaveletCodebook.cs'
      - '.github/workflows/linux-cli.yml'
  pull_request:
    paths:
      - 'IwIUniversalTool.Cli/**'
      - 'IwIUniversalTool/IwiCodec.cs'
      - 'IwIUniversalTool/VtfCodec.cs'
      - 'IwIUniversalTool/WaveletCodebook.cs'
  workflow_dispatch:

jobs:
  build-linux:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Publish Linux x64
        run: |
          dotnet publish IwIUniversalTool.Cli/IwIUniversalTool.Cli.csproj \
            -c Release -r linux-x64 --self-contained true \
            -o "${{ runner.temp }}/iwi-tool"

      - name: Smoke test
        run: |
          chmod +x "${{ runner.temp }}/iwi-tool/iwi-tool"
          "${{ runner.temp }}/iwi-tool/iwi-tool" --help

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: iwi-tool-linux-x64
          path: ${{ runner.temp }}/iwi-tool/iwi-tool
          if-no-files-found: error
