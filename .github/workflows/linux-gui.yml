name: Linux GUI (Avalonia)

on:
  push:
    branches: [ main, dev ]
    paths:
      - 'IwIUniversalTool.Avalonia/**'
      - 'IwIUniversalTool/IwiCodec.cs'
      - 'IwIUniversalTool/VtfCodec.cs'
      - 'IwIUniversalTool/WaveletCodebook.cs'
      - 'IwIUniversalTool/IwiThumbs/TextureBitmap.cs'
      - '.github/workflows/linux-gui.yml'
  pull_request:
  workflow_dispatch:

jobs:
  build-linux-gui:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Publish Avalonia for Linux x64
        run: |
          dotnet publish IwIUniversalTool.Avalonia/IwIUniversalTool.Avalonia.csproj \
            -c Release -r linux-x64 --self-contained true \
            -o "${{ runner.temp }}/iwi-avalonia"

      - name: List output
        run: ls -la "${{ runner.temp }}/iwi-avalonia"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: iwi-avalonia-linux-x64
          path: ${{ runner.temp }}/iwi-avalonia
          if-no-files-found: error
